<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>on-air</title>
<style>/*STYLES*/</style>
</head>
<body>
<!--
  The unauthenticated shell (D-35). Byte-identical for every caller, zero interpolation,
  and it discloses nothing on its own - every value below arrives at runtime from a gated
  route. That is D-25's argument applied to an app instead of a page.
-->
<div id="boot" class="boot">connecting...</div>

<!-- LOGGED OUT: the landing tally. Not a dashboard (D-39). -->
<main id="landing" class="landing" hidden>
  <div id="landing-card" class="landing-card">
    <div id="landing-word" class="landing-word"></div>
    <div id="landing-desc" class="landing-desc"></div>
  </div>
  <dl id="landing-facts" class="facts"></dl>
  <form id="login" class="login" hidden>
    <input id="login-user" type="text" autocomplete="username" placeholder="user" aria-label="user">
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="password" aria-label="password">
    <button type="submit" class="btn primary">Log in</button>
    <span id="login-err" class="err"></span>
  </form>
  <button id="login-open" class="btn">Log in</button>
</main>

<!-- LOGGED IN: the console. -->
<div id="console" hidden>
  <header class="bar">
    <div class="bar-left">
      <span class="brand">on-air</span>
      <span id="table-ver" class="muted mono"></span>
    </div>
    <div class="bar-right">
      <div class="seg-group" role="group" aria-label="View">
        <button id="view-simple" class="seg" type="button">Simple</button>
        <button id="view-advanced" class="seg" type="button">Advanced</button>
      </div>
      <!--
        The client guide, at /docs. An anchor rather than a button because it IS a
        navigation: middle-click, cmd-click and "copy link" all have to keep working, and a
        button that calls location.assign() breaks every one of them silently. New tab, so
        reading the guide never costs the console's unsaved edits.
      -->
      <a id="help" class="iconbtn" href="/docs" target="_blank" rel="noreferrer"
         aria-label="Client API guide" title="Client API guide">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="12" cy="12" r="9.1"></circle>
          <path d="M9.3 9.2a2.8 2.8 0 015.4 1c0 1.9-2.7 2.3-2.7 4.1"></path>
          <path d="M12 17.7h.01" stroke-width="2.4"></path>
        </svg>
      </a>
      <button id="theme" class="iconbtn" type="button" aria-label="Switch theme">
        <svg id="icon-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="currentColor"></circle>
          <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4"></path>
            <path d="M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"></path>
          </g>
        </svg>
        <svg id="icon-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" hidden>
          <path d="M20 14.4A8.6 8.6 0 019.6 4a8.6 8.6 0 100 17 8.6 8.6 0 0010.4-6.6z" fill="currentColor"></path>
        </svg>
      </button>
      <button id="logout" class="btn" type="button">Log out</button>
    </div>
  </header>

  <!--
    THE COMMAND SURFACE. Identical in both views and above every section, so the job this
    page is opened for - set the state - never involves travelling anywhere (#52).
  -->
  <div class="command">
    <div id="tally" class="tally">
      <div class="tally-main">
        <div id="tally-eyebrow" class="tally-eyebrow"></div>
        <div id="tally-word" class="tally-word"></div>
        <div id="tally-marks" class="tally-marks"></div>
      </div>
    </div>
    <div id="caution" class="caution" hidden></div>
    <div id="chips" class="chips"></div>
  </div>

  <div id="commit" class="commit" hidden>
    <span id="staged-count" class="staged"></span>
    <span id="staged-where" class="muted mono"></span>
    <span class="spacer"></span>
    <button id="discard-all" class="btn" type="button">Discard all</button>
    <button id="save-all" class="btn primary" type="button">Save configuration</button>
  </div>
  <div id="save-err" class="banner err-banner" hidden></div>

  <nav id="rail" class="rail" aria-label="Sections"></nav>

  <main class="sections">
    <section id="sec-status" hidden>
      <dl id="status-facts" class="facts"></dl>
    </section>

    <section id="sec-states" hidden>
      <div id="rows"></div>
      <button id="add-row" class="btn" type="button">Add a state</button>
    </section>

    <section id="sec-admin" hidden>
      <div class="fields">
        <div class="field">
          <label for="admin-view">View</label>
          <select id="admin-view">
            <option value="simple">Simple</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
      </div>
      <div id="admin-fields" class="fields"></div>
      <div class="danger">
        <button id="factory-reset" class="btn danger-btn" type="button">Factory reset</button>
        <span class="muted">Asks for the admin password.</span>
      </div>
    </section>

    <section id="sec-network" hidden>
      <div id="network-fields" class="fields"></div>
    </section>

    <section id="sec-device" hidden>
      <div id="device-fields" class="fields"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn" type="button">Cancel</button>
      <button id="modal-ok" class="btn primary" type="button"></button>
    </div>
  </div>
</div>

<script>//SCRIPT</script>
</body>
</html>
