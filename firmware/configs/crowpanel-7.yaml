# STAGE 1 BRING-UP for the Elecrow CrowPanel ESP32-S3 7.0" (SKU DIS08070H).
#
# Deliberately NOT the on-air panel yet. This file exists to answer three questions that
# have to be answered before any on-air logic is worth porting:
#
#   1. Is the pin map right? A wrong RGB map gives a garbled or black panel, and it is
#      indistinguishable from a dozen other faults if the on-air lambda is also new.
#   2. Does a build with web_server + our page machinery FIT? The module is an N4R8:
#      4MB flash, so two OTA slots of ~1.9MB each. That is the binding constraint on
#      this board and it is not one the Elegoo board has.
#   3. Does it join the WiFi and answer HTTP, so it can be verified without tailing a
#      serial log - which is the thing that hangs an agent turn.
#
# Pin map and timings from esphome/esphome-devices PR #1494, which documents THIS SKU.
# Do not lift the CrowPanel 5.0" numbers from devices.esphome.io: that page assigns the
# same physical pins to different colour channels and swaps de_pin/vsync.

substitutions:
  device_name: crowpanel-7
  friendly_name: CrowPanel 7

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    # The N4R8's PSRAM is octal and the flash is quad. qio_opi says exactly that; the
    # default assumes both match and the board does not boot.
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  # MUST be 4MB. The devkitc-1 board definition is 8MB and every 16MB example online is
  # for a different CrowPanel; setting 16MB here gives `rst:0x3` in a boot loop with no
  # log output at all, which reads like a hardware fault and is not one.
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      # Buys flash back at the cost of some speed. On 4MB that trade is the whole game.
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

# MUST be explicit. ESPHome defaults the S3 logger to USB_SERIAL_JTAG, which is the chip's
# native USB. This board does not expose it: USB goes through a CH340 wired to UART0, so
# the default sends every log line to a port that is not connected to anything and serial
# diagnostics look like a dead board.
logger:
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_encryption_key
  # Same reasoning as the Elegoo board: our driver speaks HTTP, never the native API, so
  # the default 15min no-client timer would reboot this board forever.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret web_server_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  reboot_timeout: 10min
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 2
  ota: false
  log: false
  auth:
    username: rocket
    password: !secret web_server_password
    type: basic

i2c:
  - id: touch_i2c
    sda: 19
    scl: 20
    # Left ON deliberately during bring-up: the GT911's address is latched from GPIO38 at
    # power-on, so the bus is the only authority on which of 0x5D / 0x14 this unit uses.
    scan: true
    frequency: 400kHz

# TOUCH IS DELIBERATELY NOT DECLARED HERE, and that is a finding rather than an omission.
#
# An I2C scan on this unit answers with exactly ONE device: 0x18, which is the PCA9557 I/O
# expander. The GT911 does not answer at 0x5D or at 0x14. On this board the expander holds
# the touch controller's reset line, so the touch chip is sitting in reset behind the one
# part every write-up says not to manipulate - and the same expander also controls the
# backlight, so experimenting costs a lit panel.
#
# Declaring it anyway is the wrong trade: ESPHome marks the component FAILED at every boot
# and the log grows a permanent error that is not the error anyone is looking for. An on-air
# panel is a RENDERER (D-63) and the Elegoo board has no touch at all, so nothing in the
# product needs this yet. Tracked on #57 rather than half-built.

output:
  - platform: ledc
    pin: 2
    id: backlight_pwm
    # ~1.2kHz. Lower and the panel whines audibly.
    frequency: 1220

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

font:
  - file: "gfonts://Roboto@700"
    id: font_huge
    size: 72
  - file: "gfonts://Roboto"
    id: font_text
    size: 24

globals:
  - id: frames
    type: uint32_t
    restore_value: false
    initial_value: '0'

sensor:
  - platform: template
    # Proves the panel actually repainted, over HTTP, without anyone looking at the glass.
    name: "Frames"
    id: frames_sensor
    update_interval: 5s
    accuracy_decimals: 0
    lambda: 'return (float) id(frames);'

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "IP Address"

display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    invert_colors: true
    dimensions:
      width: 800
      height: 480
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    pclk_frequency: 15MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red: [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue: [15, 7, 6, 5, 4]
    color_order: RGB
    auto_clear_enabled: false
    # An 800x480 RGB565 framebuffer is 768KB in PSRAM. Repainting it on a timer costs
    # real bus bandwidth for nothing; stage 2 will drive this from state changes.
    update_interval: 1s
    lambda: |-
      // BRING-UP TARGET, not a design. Three things have to be legible from across the
      // room for this stage to have passed: the colour bars are in the right order (so
      // the channel mapping is right), the text is sharp (so the timings are right), and
      // the IP is shown (so WiFi joined without anyone reading a serial log).
      it.fill(Color(0, 0, 0));
      it.filled_rectangle(0, 0, 266, 60, Color(255, 0, 0));
      it.filled_rectangle(266, 0, 267, 60, Color(0, 255, 0));
      it.filled_rectangle(533, 0, 267, 60, Color(0, 0, 255));
      it.printf(400, 200, id(font_huge), Color(255, 255, 255), TextAlign::CENTER, "ON AIR");
      if (id(ip_address).has_state()) {
        it.printf(400, 320, id(font_text), Color(160, 160, 160), TextAlign::CENTER,
                  "%s", id(ip_address).state.c_str());
      } else {
        it.print(400, 320, id(font_text), Color(160, 160, 160), TextAlign::CENTER,
                 "connecting...");
      }
      it.printf(400, 380, id(font_text), Color(120, 120, 120), TextAlign::CENTER,
                "stage 1 bring-up  -  %s", "${device_name}");
      id(frames)++;
