# The Elecrow CrowPanel ESP32-S3 7.0" (SKU DIS08070H) as an on-air panel. D-84, #57.
#
# Everything that is true of an on-air panel regardless of glass lives in onair-core.yaml.
# This file owns exactly what knows about THIS hardware: the module, the log UART, the
# I2C bus, the fonts and the display. If something here could be true of the Elegoo board
# too, it is in the wrong file.

substitutions:
  device_name: crowpanel-7
  friendly_name: CrowPanel 7
  onair_default_passphrase: !secret onair_passphrase

packages:
  core: !include onair-core.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    # The N4R8's PSRAM is octal and its flash is quad. qio_opi says exactly that; the
    # default assumes both match and the board does not boot.
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  # MUST be 4MB. The devkitc-1 board definition is 8MB and every 16MB CrowPanel example
  # online is for a different board; 16MB here gives `rst:0x3` in a boot loop with no log
  # output at all, which reads like a hardware fault and is not one.
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

# MUST be explicit. ESPHome defaults the S3 logger to USB_SERIAL_JTAG, the chip's native
# USB. This board cannot use it - the config gate says why, warning that GPIO19/20 are the
# JTAG pins, and this board wires the touch I2C bus to them. USB here is a CH340 on UART0.
# On the default the board runs perfectly and says nothing at all on the wire.
logger:
  hardware_uart: UART0

i2c:
  - id: touch_i2c
    sda: 19
    scl: 20
    scan: true
    frequency: 400kHz

# TOUCH IS DELIBERATELY NOT DECLARED, and that is a finding rather than an omission.
#
# An I2C scan on this unit answers with exactly ONE device: 0x18, the PCA9557 I/O expander.
# The GT911 answers at neither 0x5D nor 0x14, so this is not the documented address
# lottery - the touch controller sits in reset behind the expander every write-up says not
# to manipulate, and that same expander drives the backlight. Declaring it anyway just
# marks the component FAILED at every boot. An on-air panel is a RENDERER (D-63) and the
# Elegoo board has no touch at all. Tracked on #57.

output:
  - platform: ledc
    pin: 2
    id: backlight_pwm
    # ~1.2kHz. Lower and the panel whines audibly.
    frequency: 1220

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

font:
  - file: "gfonts://Roboto@700"
    id: label_huge
    size: 110
  - file: "gfonts://Roboto@700"
    id: label_big
    size: 64
  - file: "gfonts://Roboto"
    id: note_text
    size: 30
  - file: "gfonts://Roboto"
    id: band_text
    size: 22
  # The overlay clock (#71). Large enough to read across a room, and deliberately SMALLER
  # than label_huge: the state is what this panel exists to say and the time must not
  # out-shout it. At 72px "12:34 PM" is ~330 of the 800px width.
  - file: "gfonts://Roboto@700"
    id: clock_big
    size: 72

# ---- the repaint request, consumed (#64) -----------------------------------------
#
# The core sets `repaint_pending` when something that changes the picture happens; this is
# where a board turns that into a paint of ITS OWN display. The id `my_display` never
# leaves this file, which is D-85's rule: a block that names board hardware is board
# knowledge. See the global's comment in onair-core.yaml for why this is a flag and not a
# trigger on the entity - the direct form was measured and does not work.
#
# 100ms, so a state change reaches the glass within a tenth of a second. The cost is one
# bool test per tick against the ~150ms repaint it replaces.
interval:
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(repaint_pending);'
          then:
            - lambda: 'id(repaint_pending) = false;'
            - component.update: my_display

display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    invert_colors: true
    dimensions:
      width: 800
      height: 480
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    pclk_frequency: 15MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red: [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue: [15, 7, 6, 5, 4]
    color_order: RGB
    auto_clear_enabled: false
    # NEVER. The paint is driven entirely by `repaint_pending` (#64) - see the interval
    # above. A full repaint of 800x480 costs ~150ms, measured, so on the old 1s timer this
    # panel spent ~15% of its loop redrawing an identical frame, and the paint BLOCKS, so
    # an HTTP request could be delayed by a whole paint. #65 wants to poll as fast as
    # 250ms, which that would not survive.
    #
    # `never` rather than a slow number, so that EVERY repaint in this system arrives
    # through `repaint_pending` and there is exactly one place to look when asking why the
    # glass redrew. The safety net is a timed SET of the flag in onair-core.yaml, which
    # also puts it where it belongs: "something should redraw every 30s" is true of any
    # panel, while "which display" is board knowledge (D-85).
    #
    # MEASURED on the live CrowPanel: 1.0 fps before, 0.033 fps idle after - a 30x cut -
    # and a state change repaints within one 100ms tick.
    update_interval: never
    lambda: |-
      // ---- WHAT to draw: the SAME decision the Elegoo panel makes, from the same
      //      function. compute_view() lives in onair_table.h and is shared by both
      //      renderers and by the device-served status page (#33). Nothing about the
      //      meaning of a state is decided here; this lambda only knows how to paint.
      onair::View view = onair::compute_view(
          id(presence_key).has_state() ? id(presence_key).state : std::string(),
          id(last_contact_ms),
          (uint32_t) id(connection_lost_ms).state,
          (uint32_t) id(no_data_ms).state);
      const char *label = view.eff.known ? view.eff.row.label.c_str() : "";

      auto rgb = [](uint32_t c) {
        return Color((c >> 16) & 0xff, (c >> 8) & 0xff, c & 0xff);
      };
      auto ink   = Color(230, 230, 230);
      auto dim   = Color(140, 140, 140);
      auto slate = Color(18, 20, 24);

      // Diagonal hatch. On the 1-bit panel this is drawn with vertical bars because that
      // is all 128x64 affords; here it can be what it means - a surface you cannot read
      // through cleanly, laid OVER the colours rather than replacing them.
      auto hatch_over = [&](int y0, int y1, Color c) {
        for (int x = -480; x < 800; x += 26)
          for (int t = 0; t < 6; t++)
            it.line(x + t + (y1 - y0), y0, x + t, y1, c);
      };

      Color bg = slate, fg = ink;
      bool hatched = false;

      // ---- WHERE THE STATE RENDER LIVES, and the one place the clock costs anything (#71).
      //
      // With the clock off this is the whole panel above the diagnostics band, unchanged.
      // With it on, the top 140px become the clock's and the state render is mapped into
      // what is left. Every y in the branches below is still written in the ORIGINAL 0..430
      // coordinates and passed through sy(), so each branch stays readable as a layout and
      // there is exactly one line to look at when asking how the clock moved something.
      //
      // A MAP AND NOT A SHIFT, which was the first thing tried and does not work: the row
      // branch's "NOT REFRESHING" line already sits at 360, so shifting it down by the strip
      // height would push it into the band. Scaling keeps every branch inside its own space.
      const int BAND_TOP = 430;
      const bool clock_on = id(show_clock).state;
      const int state_top = clock_on ? 140 : 0;
      auto sy = [&](int y) { return state_top + y * (BAND_TOP - state_top) / BAND_TOP; };

      if (view.shape == onair::Shape::NO_CONFIG) {
        // NO CONFIG - the table has never arrived, so there is no row to render and no
        // claim this panel is entitled to make. Distinct from NO DATA on purpose: NO DATA
        // means the SERVER stopped talking about state, this means WE have never heard the
        // vocabulary. Different fix, different picture.
        it.fill(slate);
        hatch_over(sy(0), sy(300), Color(60, 64, 72));
        it.printf(400, sy(150), id(label_big), ink, TextAlign::CENTER, "NO CONFIG");
        it.printf(400, sy(330), id(note_text), dim, TextAlign::CENTER, "%s",
                  id(server_host).state.empty() ? "no server set" : id(server_host).state.c_str());
        id(render_branch) = 6;
      } else if (view.shape == onair::Shape::UNKNOWN_KEY) {
        // UNKNOWN KEY - the server named a state this build cannot draw. The key itself
        // goes on the glass so a firmware/server skew is diagnosable from across the room.
        it.fill(slate);
        it.filled_rectangle(0, sy(0), 800, sy(110) - sy(0), Color(90, 60, 20));
        it.printf(400, sy(55), id(label_big), ink, TextAlign::CENTER, "UNKNOWN KEY");
        it.printf(400, sy(220), id(note_text), ink, TextAlign::CENTER, "%s",
                  view.key.empty() ? "(no state)" : view.key.c_str());
        hatch_over(sy(300), sy(400), Color(60, 64, 72));
        id(render_branch) = 4;
      } else if (view.shape == onair::Shape::NO_DATA) {
        // NO DATA - never blank, never calm. Blank reads as "nothing is happening", which
        // is a claim, and it is the one claim this panel has no evidence for.
        it.fill(slate);
        hatch_over(sy(0), sy(300), Color(70, 74, 82));
        it.printf(400, sy(150), id(label_big), ink, TextAlign::CENTER, "NO DATA");
        id(render_branch) = 3;
      } else {
        // A ROW, drawn in the operator's own colours - INCLUDING a calm one that is no
        // longer being refreshed. That is the change D-91 makes here, and it is the whole
        // reason this panel stops sitting on NO DATA: compute_view used to turn
        // `stale && !busy` into NO_DATA one layer down, so a calm row on an old write was
        // thrown away outright, and the last write is routinely hours old.
        //
        // The calm claim is still never drawn as a CONFIDENT one. Past the connection-lost
        // threshold it takes the hatch and says so in words, and past the no-data threshold
        // compute_view gives it up entirely. D-92 chose that over a shorter window for calm
        // rows: mark everything at one minute, hold everything for thirty, no per-row branch.
        //
        // The hatch treatment itself is D-82's and is unchanged: an unrefreshed row keeps
        // its OWN colours rather than draining toward grey, because draining weakens a busy
        // signal and a false OFF is worse than a false ON.
        //
        // CALM_HEAVY and CALM_LIGHT collapse to one picture here. That split exists only
        // because a 1-bit panel has no colour and must pick a SHAPE by luminance; this
        // panel just draws the operator's colours. render_branch still reports the shape
        // compute_view CHOSE, so both boards report the same vocabulary over HTTP - which
        // is what makes two panels comparable at all (#57 stage 3).
        bg = rgb(view.eff.row.bgcolor);
        fg = rgb(view.eff.row.color);
        hatched = view.unrefreshed;

        it.fill(bg);
        // A long label will not fit at 110px. Pick the size from the label, not the row.
        auto f = strlen(label) > 9 ? id(label_big) : id(label_huge);
        it.printf(400, sy(210), f, fg, TextAlign::CENTER, "%s", label);

        if (hatched) {
          // FROM sy(0), so the hatch never crosses the clock strip. The hatch means "this
          // STATE is not being refreshed", and that claim is about the state - the clock is
          // local and keeps ticking regardless, so hatching it would be a false statement.
          hatch_over(sy(0), sy(400), fg);
          it.printf(400, sy(360), id(note_text), fg, TextAlign::CENTER,
                    "NOT REFRESHING - SHOWING LAST KNOWN");
        }
        id(render_branch) = (int) view.shape;
      }

      // ---- THE CLOCK, OVER THE STATE (#71) --------------------------------------------
      //
      // LAST of the state area and not first, because every branch begins with it.fill() -
      // drawn earlier it would be painted over. Drawing it here also means it lands on the
      // ROW'S OWN background in `fg`, so it is legible on every colour in the table without
      // this file knowing any of them.
      //
      // Centred at y=74 with a 72px font, so its top edge is ~38px - 8% of the 480px panel,
      // inside the 5-10% margin asked for.
      if (clock_on) {
        auto t = id(wall_clock).now();
        it.print(400, 74, id(clock_big), fg, TextAlign::CENTER,
                 onair::format_clock(t.is_valid(), t.hour, t.minute).c_str());
      }

      // ---- diagnostics band LAST, y>=430 is reserved and never overdrawn ----
      it.filled_rectangle(0, 430, 800, 50, Color(10, 11, 13));
      it.line(0, 430, 799, 430, Color(70, 74, 82));
      if (id(ip_address).has_state()) {
        it.printf(14, 445, id(band_text), dim, "IP: %s", id(ip_address).state.c_str());
      } else {
        it.print(14, 445, id(band_text), dim, "IP: connecting...");
      }
      if (id(wifi_signal_db).has_state()) {
        it.printf(786, 445, id(band_text), dim, TextAlign::TOP_RIGHT, "%.0fdBm",
                  id(wifi_signal_db).state);
      }

      // NOTE: the clock used to sit here, centred in this band at 22px. It was legible from a
      // desk and not from across the room, which is the distance this panel is read at (#71).
      // It is drawn over the state now; the band is diagnostics only again.

      // Last statement on every path: proves the panel repainted.
      id(frames)++;
