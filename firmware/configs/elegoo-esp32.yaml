substitutions:
  device_name: elegoo-esp32
  friendly_name: Elegoo ESP32
  # The first-boot passphrase, compiled in. It reaches a lambda as a string literal, so a
  # value containing a double quote or a backslash breaks the BUILD rather than doing
  # anything subtle - which is the failure mode to want here.
  onair_default_passphrase: !secret onair_passphrase


packages:
  core: !include onair-core.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

switch:
  # Board knowledge, so it lives with the board (moved out of onair-core.yaml). The blue
  # onboard LED on most ESP32 DevKits is GPIO2, active-high. On the CrowPanel that same pin
  # drives the backlight, which is what forced the split.
  - platform: gpio
    name: "${friendly_name} Onboard LED"
    pin: GPIO2
    restore_mode: ALWAYS_OFF

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  # The esp32 default is 50kHz, which makes a full SH1106 repaint ~200-220ms of
  # blocking I2C on the device that now also serves HTTP. 400kHz drops it to ~28ms.
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: status_title
    size: 14
  - file: "gfonts://Roboto"
    id: status_text
    size: 11
  - file: "gfonts://Roboto@700"
    id: status_huge
    size: 30
  # The middle rung. Without it `label_font` fell off 30px straight to the 14px NOTE face,
  # so AVAILABLE and RECORDING - nine characters, the commonest rows on this panel - were
  # drawn in the same size as the IP address underneath them.
  - file: "gfonts://Roboto@700"
    id: status_mid
    size: 20

# The envelope research for #50 could establish only a FLOOR for contiguous heap - 24.7 KB,
# because the config page's reserve() succeeds on hardware - and no ceiling. Pool A's budget
# was therefore an estimate, and an estimate is a poor thing to have between a page and
# abort(). This costs a few hundred bytes and turns it into a measurement.

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      // ---- diagnostics band FIRST, y>=49 is reserved and never overdrawn ----
      it.line(0, 49, 127, 49);
      // THE CLOCK TAKES THE IP's SLOT (#69), and that is forced rather than preferred:
      // "IP: 192.168.1.123" plus "-52dBm" already spends ~123 of this band's 128 pixels, so
      // there is no third slot to put a clock in. The 48px above the band belongs to the
      // state and is never overdrawn, so the choice is the IP or nothing - and the IP is
      // still on /onair, on the ESPHome dashboard and in the router's lease table, while the
      // clock has nowhere else to be. The CrowPanel has the room and keeps both.
      if (id(show_clock).state) {
        auto t = id(wall_clock).now();
        it.print(0, 52, id(status_text),
                 onair::format_clock(t.is_valid(), t.hour, t.minute).c_str());
      } else if (id(ip_address).has_state()) {
        it.printf(0, 52, id(status_text), "IP: %s", id(ip_address).state.c_str());
      } else {
        it.print(0, 52, id(status_text), "IP: connecting...");
      }
      if (id(wifi_signal_db).has_state()) {
        it.printf(127, 52, id(status_text), TextAlign::TOP_RIGHT, "%.0fdBm", id(wifi_signal_db).state);
      }

      // ---- WHAT to draw: ONE decision, made in onair_table.h and shared with the
      //      device-served status page (#33). The page has to be able to say NO CONFIG,
      //      UNKNOWN KEY and NO DATA for exactly the reasons the glass says them, and the
      //      only way to guarantee that permanently is for there to be one function.
      //      Staleness, THE BUSY RULE and the luminance choice all live in there now.
      //
      //      Three causes, three pictures, unchanged since #43:
      //        no table  -> we have never reached the server. NO CONFIG.
      //        no row    -> we reached it once and it has moved on. UNKNOWN KEY, re-pull.
      //        a row     -> render it, with any local override already applied.
      //      The device is still handed an OPAQUE key and still declares no vocabulary of
      //      its own (D-38); the overlay changes how a row LOOKS and never which rows
      //      exist or which of them is busy.
      onair::View view = onair::compute_view(
          id(presence_key).has_state() ? id(presence_key).state : std::string(),
          id(last_contact_ms),
          (uint32_t) id(connection_lost_ms).state,
          (uint32_t) id(no_data_ms).state);
      const char *label = view.eff.known ? view.eff.row.label.c_str() : "";

      // A long label will not fit at 30px. Pick the size from the label, not the row.
      // Three rungs, measured against this 128px glass at Roboto 700: ~17px per character at
      // 30, ~12 at 20, ~8 at 14. So "ON AIR" (6) takes 30, "AVAILABLE" and "RECORDING" (9)
      // take 20, and "INTERRUPTIBLE" (13) takes 14 - each the largest that still fits.
      auto label_font = [&](const char *t) {
        const size_t n = strlen(t);
        return n <= 6 ? id(status_huge) : (n <= 10 ? id(status_mid) : id(status_title));
      };

      if (view.shape == onair::Shape::NO_CONFIG) {
        // NO CONFIG - the table has never arrived, so there is no row to render and no
        // claim this panel is entitled to make. Distinct from NO DATA on purpose: NO DATA
        // means the SERVER stopped talking about state, this means WE have never heard
        // the vocabulary. Different fix, different picture.
        for (int x = 0; x < 128; x += 4) it.line(x, 0, x, 14, COLOR_ON);
        it.printf(64, 26, id(status_title), COLOR_ON, TextAlign::CENTER, "NO CONFIG");
        it.printf(64, 42, id(status_text), COLOR_ON, TextAlign::CENTER, "%s",
                  id(server_host).state.empty() ? "no server set" : id(server_host).state.c_str());
        id(render_branch) = 6;
      } else if (view.shape == onair::Shape::UNKNOWN_KEY) {
        // UNKNOWN KEY - the server named a state this build cannot draw. Solid header so
        // it cannot be mistaken for any of the rows, and the key itself on the glass so a
        // firmware/server skew is diagnosable without opening a laptop. Left-aligned
        // deliberately: a long key clips its tail, not its identifying head.
        it.filled_rectangle(0, 0, 128, 16, COLOR_ON);
        it.printf(64, 8, id(status_title), COLOR_OFF, TextAlign::CENTER, "UNKNOWN KEY");
        it.printf(2, 20, id(status_text), COLOR_ON, TextAlign::TOP_LEFT, "%s",
                  view.key.empty() ? "(no state)" : view.key.c_str());
        for (int x = 0; x < 128; x += 4) it.line(x, 40, x, 47, COLOR_ON);
        id(render_branch) = 4;
      } else if (view.shape == onair::Shape::NO_DATA) {
        // NO DATA - hatched band. Never blank, never calm.
        for (int x = 0; x < 128; x += 4) it.line(x, 0, x, 14, COLOR_ON);
        it.printf(64, 26, id(status_title), COLOR_ON, TextAlign::CENTER, "NO DATA");
        id(render_branch) = 3;
      } else {
        // A ROW, drawn as one picture per SAFETY CLASS - the closest a 1-bit panel gets to
        // the CrowPanel's `it.fill(bg); print(label)`.
        //
        // WHY THIS IS NOT SIMPLY THE COLOUR PANEL'S BRANCH: this glass is a monochrome
        // SH1106. It has no colour to fill with, and the row colours do not survive being
        // reduced to ink - AVAILABLE (#0b6e2e) and ON AIR (#c1121f) are luminance 73 and
        // 71, TWO APART out of 255. Drawing "the operator's colours" here would render
        // "in a call" and "not in a call" as the same grey field with a different word in
        // it, and FALSE OFF is the one error that matters (D-6/D-63). So busy keeps the
        // ink: solid field, words knocked out. Calm is the plain field. That difference is
        // legible across a room; nine characters of text is not.
        //
        // CALM_HEAVY and CALM_LIGHT COLLAPSE TO ONE PICTURE, which is the change here. The
        // ring and the double frame were the mono panel's way of showing the difference
        // between two calm rows back when this board was the only renderer; they read as
        // decoration next to the colour panel, and both mean exactly "not busy". The split
        // still HAPPENS in compute_view and `render_branch` still reports which shape it
        // chose, so both boards go on reporting the same vocabulary over HTTP - which is
        // what makes two panels comparable at all (#57 stage 3, D-147).
        const bool busy = view.eff.row.busy;
        if (busy) it.filled_rectangle(0, 0, 128, 48, COLOR_ON);
        const auto ink = busy ? COLOR_OFF : COLOR_ON;
        it.printf(64, 22, label_font(label), ink, TextAlign::CENTER, "%s", label);
        // CONDITION 2 (D-91): the state is held, and the panel says it is not being
        // refreshed. "NO LINK" and not "STALE" - the state is not stale, the LINK is.
        //
        // ON CALM ROWS TOO, which it was not before. The busy branch carried this mark and
        // the two calm branches carried nothing, so a calm row on a dead link looked exactly
        // like a calm row on a healthy one. The colour panel has always hatched both
        // (D-91/D-82); this board simply never caught up.
        if (view.unrefreshed) it.print(64, 46, id(status_text), ink, TextAlign::BASELINE_CENTER, "NO LINK");
        id(render_branch) = (int) view.shape;
      }

      // Last statement on every path: proves the panel repainted.
      id(frames)++;
