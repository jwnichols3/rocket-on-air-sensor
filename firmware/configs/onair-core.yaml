# THE ON-AIR CORE: everything that is true of an on-air panel regardless of what glass it
# is driving. Included as an ESPHome `packages:` entry by every board file.
#
# This exists because of D-83's lesson, which had just bitten: a rule written out in more
# than one place does not stay one rule, and the copy that drifts is the one nobody is
# looking at. Two boards sharing ~450 lines of state-table machinery by copy-paste would
# drift within a week, and the failure would be a panel quietly disagreeing with the panel
# next to it - which is the exact thing onair_table.h's single compute_view() exists to
# prevent, undone one level up.
#
# WHAT BELONGS HERE: the state table and its pull, the entities the server drives, the
# scripts, the served pages, and the rendering DECISION.
# WHAT DOES NOT: anything that knows the size, colour depth or pin map of a display. Board
# files own substitutions, esp32, logger, i2c, font and display - and nothing else.
#
# Every board file must define: device_name, friendly_name, onair_default_passphrase.

# A DEFAULT, not a fixture. ESPHome merges a package's substitutions with the including
# file's and the includer wins, so any board file can override this with one line - MEASURED
# by setting it to UTC in a board file and reading the timezone back out of `esphome config`,
# not assumed from the docs.
#
# It lives in the core rather than in each board because a timezone is a property of where a
# panel HANGS, not of what glass it uses, and every panel in this system hangs in one house.
substitutions:
  onair_timezone: America/Los_Angeles

esphome:
  # The state table, its lookup, its parser, the local presentation overlay and the
  # effective-row computation both renderers share (onair_table.h); and the two pages the
  # device serves (onair_page.h, #33). Headers rather than an external component: they
  # register handlers on the web server ESPHome already runs, which is all D-40's
  # component argument ever came down to.
  includes:
    - onair_table.h
    - onair_assets.h
    - onair_page.h
  on_boot:
    # ABOVE web_server's own setup priority (setup_priority::WIFI - 1 = 249), and that is the
    # whole reason this is a second on_boot rather than one more line in the block below.
    # Handlers are dispatched in registration order and ESPHome's web_server claims "/", so
    # the redirect only wins if it is registered first. Registered at LATE it would lose
    # silently - see install_root_redirect() (#56).
    - priority: 600
      then:
        - lambda: 'onair::install_root_redirect();'

    # setup_priority::LATE - runs strictly after every component setup(). The template
    # text's setup() ends in publish_state(), which fires on_value unconditionally, so a
    # restored entity value must not be able to look like evidence of anything.
    #
    # The zeroing that used to be here is gone with `last_write_ms` (D-91, #65). What
    # replaced it needs no boot fix-up and cannot have this bug: `last_contact_ms` starts
    # at 0 and is only ever set by a SUCCESSFUL POLL, so a restored `available` renders as
    # NO DATA until the server actually answers, rather than as calm for 90 seconds.
    - priority: -100
      then:
        - lambda: |-
            // Before anything can pull. The stored value wins over the compiled-in one, so
            // a rotation typed at the panel survives a reflash.
            onair::load_passphrase("${onair_default_passphrase}");
            // The local presentation overlay (#33). Persisted, unlike the table - a row the
            // operator renamed survives a reboot, the vocabulary it renames does not.
            onair::load_overlay();
            // How the served PAGES look (D-70). Nothing to do with the glass - a skin has no
            // path to compute_view() and no vote in which SHAPE is drawn.
            onair::load_appearance();
            // Priority -100 runs after every component setup(), and web_server's is
            // WIFI - 1, so the server is up and a handler added now attaches to it live.
            onair::install_pages();

api:
  encryption:
    key: !secret api_encryption_key
  # The default is 15min and it fires when no NATIVE API client connects. Our driver
  # speaks HTTP, so it would never be satisfied and the board would reboot every 15
  # minutes forever. This timer fires in the healthy case; the wifi one does not.
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fixes the 3ms-to-124ms latency spread. Costs battery, irrelevant on USB.
  power_save_mode: NONE
  # Lengthened, deliberately NOT zeroed: this is the only self-heal for a wedged WiFi
  # stack, and restore_value means a reboot preserves the level anyway.
  reboot_timeout: 10min

  # The boot pull. NOT on_boot: at on_boot priority there is no network yet. on_connect
  # also covers a reconnect after an outage, which is exactly when the table is most
  # likely to have moved.
  #
  # UNGATED by auto_profile, unlike every other automatic trigger. The table is not
  # persisted (see onair_table.h), so a frozen board that reboots has nothing to freeze -
  # gating this would strand it on NO CONFIG until someone walked over and pressed
  # Refresh. Freezing means "stop following CHANGES", and a board with no table at all is
  # not being asked to follow a change.
  on_connect:
    then:
      - script.execute: pull_table

  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

# Needed by the config pull, and declared rather than left to web_server's auto-load so
# the dependency is visible where it is used.
json:

http_request:
  id: http_client
  useragent: onair-panel
  # Longer than the server's own handlers need, short enough that a wedged link does not
  # hold the loop through a display refresh.
  timeout: 5s
  # The request runs in the main loop. Without this a server that accepts the connection
  # and then stalls trips the task watchdog before the request times out, and the board
  # reboots for a reason that looks nothing like its cause.
  watchdog_timeout: 15s
  # D-17 pinned this transport to plain HTTP on the LAN. Leaving verification on would
  # compile in the certificate bundle for a scheme this device never speaks.
  verify_ssl: false

web_server:
  port: 80
  version: 2
  # Closes the unauthenticated firmware-upload endpoint captive_portal auto-loads.
  # Scope is web_server only - the captive portal can still do an unauthenticated
  # /update while the fallback AP runs, which is password-protected and is the
  # recovery case you want it for.
  ota: false
  log: false
  auth:
    # ONE default login for the whole product, matching DEFAULT_ADMIN_USER and
    # DEFAULT_ADMIN_PASSWORD in server/src/auth.ts (D-56). Two different default
    # credentials for two web UIs of the same system was confusing for no benefit.
    #
    # Stated plainly: `ESP32` is published in a public repo, so this replaces a random
    # per-device password with a KNOWN one. Deliberate. The panel is on a LAN and drives a
    # light; the credential that actually matters - the server passphrase - is a different
    # one, is not a default, and is not readable from here (D-55). Set
    # `web_server_password` in secrets.yaml to something else per device if you want.
    username: rocket
    password: !secret web_server_password
    # MUST be explicit: the default flips to digest in ESPHome 2027.1.0, which would
    # silently break every driver request.
    type: basic

# ---- the wall clock (#69) ----------------------------------------------------------
#
# SNTP AND NOTHING ELSE, and that is a conclusion rather than a default. There is no Home
# Assistant in this system to take time from, neither board carries an RTC, and pushing the
# time from the server would put a clock in docs/api-contract.md and still need local
# interpolation between polls - real work for a worse answer. The network is the only source
# this product already has.
#
# Which is also why the clock is drawn only when it is VALID: this source can simply never
# arrive. A panel on a network with no route to an NTP server is a case that has to render,
# and it renders as CLOCK_UNSET. See format_clock() in onair_table.h.
time:
  - platform: sntp
    id: wall_clock
    timezone: ${onair_timezone}
    # THE MINUTE TICK, and the only reason this component is more than a data source.
    #
    # The CrowPanel paints on `repaint_pending` alone (#64) with a 30s safety net, so a
    # clock left to that net would show a minute up to 30 seconds late - which is visibly
    # wrong in the one way a clock is not allowed to be wrong. This asks for the repaint
    # exactly when the digits change.
    #
    # GATED on the switch, so a panel with the clock off pays nothing for this: without the
    # test it would force a full 800x480 repaint every minute, forever, to redraw a frame
    # nobody asked for. That is the same waste #64 removed.
    on_time:
      - seconds: 0
        then:
          - lambda: 'if (id(show_clock).state) id(repaint_pending) = true;'

globals:
  - id: frames
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Which branch the display lambda last drew. Published as the "Render" text sensor so
  # the panel is readable over HTTP: "confirmed" can then mean the glass drew this,
  # rather than a variable holds this.
  - id: render_branch
    type: int
    restore_value: false
    initial_value: '0'
  # ---- the repaint request (#64) ---------------------------------------------------
  #
  # THE PAINT IS DRIVEN BY CHANGE, NOT BY A TIMER. A full 800x480 repaint costs ~150 ms
  # (measured), so at 1 s the CrowPanel spent ~15% of its loop redrawing an identical
  # frame while also serving HTTP - and #65 wants to poll four times a second, which is
  # not safe until the paint stops doing that.
  #
  # WHY A FLAG AND NOT A TRIGGER. The obvious shape is `on_value: component.update:
  # my_display` on `presence_key`. It cannot be written: `presence_key` is a CORE entity
  # and `my_display` is board-local, and D-85's rule is that anything naming board
  # hardware is board knowledge. Extending the core's entity from the board file does not
  # work either - MEASURED, not assumed: ESPHome 2026.8.0 does not merge package list
  # entries by `id`, so a board-side `text:` block with the same id produces a SECOND
  # entity and a validation error, rather than an additional trigger.
  #
  # So the core says WHAT happened and each board decides what to do about it. The core
  # sets this; a board-local interval consumes it and updates its own display. That keeps
  # the display id where it belongs and costs a bool test per tick instead of a repaint.
  - id: repaint_pending
    type: bool
    restore_value: false
    # True at boot so the first frame is drawn without waiting for anything to change.
    initial_value: 'true'
  # ---- the client contract's clock (D-91, #65) -------------------------------------
  #
  # WHEN THE SERVER LAST ANSWERED THIS PANEL. Every threshold is measured from here, and
  # this is the only clock that matters now - `last_write_ms` and its 90s STALE_MS are
  # gone, because the age of a WRITE stopped meaning anything the moment the server
  # started latching state (D-91). A two-hour-old `available` on a server that is
  # answering every second is simply the state.
  #
  # 0 means "never heard from the server since boot", which is not a gap of zero - it is
  # the largest gap there is, and compute_view treats it as such.
  - id: last_contact_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_poll_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # What the last poll said, so a repaint is requested only when the picture would change.
  - id: last_marked_unrefreshed
    type: bool
    restore_value: false
    initial_value: 'true'

text:
  # THE state entity. The `select` it replaced is gone (D-38, proven on hardware in D-44),
  # and with it the device's claim to own the set of valid states: under D-31 the server
  # owns that set and this panel is a renderer, which `text` encodes correctly. Options on
  # a template select are compile-time YAML with no runtime API, so a user-editable table
  # would have meant a reflash per row.
  #
  # What was lost with the select: free rejection of an unknown option at the device.
  # Validation is the server's job now, and the display's UNKNOWN branch below is what an
  # unrecognised key looks like from the glass.
  - platform: template
    # URL segment is this NAME, not the object_id - same coupling the select has.
    name: "PresenceKey"
    id: presence_key
    # Required on template text. `password` would mask the value in the JSON, which is
    # wrong here - the driver has to read this back to confirm.
    mode: text
    optimistic: true
    restore_value: true
    # Index 0 of the old select was "dnd" so that every degenerate path landed on the
    # safe state. Same reasoning; the landing place is now the reserved `unknown` row,
    # because `dnd` stopped being a key this panel recognises when the hardcoded table
    # went (#43) and a restored `dnd` would come back as UNKNOWN KEY.
    initial_value: "unknown"
    # A row id is <=32 chars (D-31); 64 leaves room without inviting prose.
    #
    # min_length 1 because an empty write is accepted otherwise, and "" is not a state -
    # it would leave the panel rendering nothing, which reads exactly like calm.
    # MEASURED: a length violation returns 200 and is SILENTLY DROPPED, the same trap
    # D-17 documented for select options. Read-back stays mandatory on this transport.
    min_length: 1
    max_length: 64
    on_value:
      then:
        - lambda: |-
            // The state moved, so the glass is now wrong. This is the trigger the whole
            // on-change paint hangs off (#64).
            //
            // It does NOT stamp a clock any more. A write used to set `last_write_ms`,
            // which the 90s staleness rule was measured from; under D-91 the age of a
            // write means nothing and only `last_contact_ms` - set by a successful POLL -
            // decides anything. A push arriving is a happy accident, not evidence of a
            // healthy link, because the server does not care whether it landed (D-92).
            id(repaint_pending) = true;
        # A key this table does not contain means the server moved and we are stale. Pull
        # at once rather than waiting out the interval, so the panel self-heals in one
        # round trip (D-38). The UNKNOWN KEY branch is what it looks like until then.
        - if:
            condition:
              and:
                # FROZEN MEANS FROZEN. Self-healing is still following the server, and
                # `custom` is the operator saying stop following. The panel sits on
                # UNKNOWN KEY until someone unfreezes it or presses Refresh, which is
                # visible and honest - silently un-freezing would not be.
                - switch.is_on: auto_profile
                - lambda: 'return onair::held().have && onair::find(onair::held().table, x) == nullptr;'
            then:
              - logger.log: "unknown key for this table - re-pulling"
              - script.execute: pull_table

  # ---- the version nudge (D-42) ----------------------------------------------------
  # The server writes the table's version here alongside the state it already writes. A
  # version we do not hold triggers a pull. This is a TRIGGER for a pull, not a push of
  # the table: no configuration travels on the state path, and the server still keeps no
  # registry beyond the one host it already writes to. Cost is one integer.
  #
  # NOT restore_value: a restored version would match a table we no longer hold after a
  # reboot, and the nudge would stay silent exactly when it is needed. It is cheap to
  # re-learn and expensive to be wrong about.
  - platform: template
    name: "TableVersion"
    id: table_version_entity
    mode: text
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 16
    on_value:
      then:
        - if:
            condition:
              and:
                # Gated for the same reason as the interval: the nudge is the server
                # asking to be followed, and that is exactly what `custom` declines.
                - switch.is_on: auto_profile
                - lambda: 'return !x.empty() && x != onair::held().version;'
            then:
              - logger.log: "server announced a table version we do not hold - pulling"
              - script.execute: pull_table

  # ---- connection settings (D-38) --------------------------------------------------
  # Rocket's actual list - which server, which port, which passphrase - as entities at
  # the device's own address, behind the basic auth web_server already enforces (D-17).
  # `restore_value` puts them in NVS, so a reboot does not send the panel back to a
  # factory host. What is NOT here is an editable table: that needs an external
  # component and is #33 (D-40).
  - platform: template
    name: "ServerHost"
    id: server_host
    mode: text
    optimistic: true
    restore_value: true
    initial_value: !secret onair_server_host
    # 0, not 1: an empty host is a legitimate thing to type on the way to a new one, and
    # the pull already refuses to run without one. Refusing the keystroke instead would
    # mean the field could never be cleared.
    min_length: 0
    max_length: 64
  - platform: template
    name: "ServerPassphrase"
    id: server_passphrase
    # WRITE-ONLY, and that is a correction to D-38 rather than caution.
    #
    # D-38 said `mode: password` keeps the value out of the device's own REST API. It does
    # not: web_server masks `state` and writes the raw string to `value` on every GET and
    # every SSE event (measured on 2026.8.0 - see onair_table.h). So this entity does not
    # HOLD the passphrase at all. `lambda:` makes its value a constant, and `set_action`
    # is the only way in - which is what a credential field should have been anyway.
    #
    # `lambda:` also rules out `optimistic` and `restore_value`, which is why persistence
    # moved to a preference blob in the header.
    mode: password
    lambda: 'return {std::string("********")};'
    # It never changes. This exists only because a template text is a polling component.
    update_interval: 60s
    min_length: 0
    max_length: 128
    set_action:
      then:
        - lambda: 'onair::set_passphrase(x);'
        - logger.log: "server passphrase updated"
        # Ungated, like the Refresh button: typing a new passphrase is a person asking
        # to find out whether it works, not the server asking to be followed.
        - script.execute: pull_table

number:
  - platform: template
    name: "ServerPort"
    id: server_port
    optimistic: true
    restore_value: true
    initial_value: 8484
    min_value: 1
    max_value: 65535
    step: 1
    mode: box

  # ---- THE CLIENT CONTRACT'S THREE NUMBERS (D-92, #65) ------------------------------
  #
  # Configuration, not constants, and persisted in NVS like every other device setting -
  # so they are editable from the panel's own config page and over HTTP, and they survive
  # a reboot. `onair_table.h` carries the same three as compiled DEFAULTS only; the live
  # values are these, and `publish_context` mirrors them to the device-served page so the
  # page can never disagree with the glass beside it.
  #
  # MILLISECONDS, as bounded integers rather than a menu of named speeds. A fixed enum of
  # 1/5/30/60s is always slightly wrong for somebody and needs a reflash to widen.
  #
  # The ceilings are not arbitrary: an ESPHome number is a float, and a float32 represents
  # integers exactly only up to 2^24 (16,777,216). Every bound below sits under that, so a
  # value set here is the value stored and read back, with no rounding to explain.
  - platform: template
    name: "PollIntervalMs"
    id: poll_interval_ms
    optimistic: true
    restore_value: true
    initial_value: 1000
    # THE FLOOR IS 250 AND IT IS MEASURED, NOT TASTE. A full 800x480 repaint costs ~150ms
    # and it blocks, so a fast poll was unsafe until the paint became on-change (#64,
    # D-99: 1.0 fps -> 0.033 fps idle). The poll itself is a LAN round trip and cheap.
    min_value: 250
    max_value: 60000
    step: 50
    mode: box
  - platform: template
    name: "ConnectionLostMs"
    id: connection_lost_ms
    optimistic: true
    restore_value: true
    initial_value: 60000
    # One second is a legal floor here: this threshold only ever makes the panel MORE
    # honest, so there is no safety reason to stop someone tightening it.
    min_value: 1000
    max_value: 3600000
    step: 1000
    mode: box
  - platform: template
    name: "NoDataMs"
    id: no_data_ms
    optimistic: true
    restore_value: true
    initial_value: 1800000
    # Thirty minutes by default because A MEETING RUNS ABOUT THIRTY MINUTES: the state has
    # to survive a server outage for at least that long or the panel goes dark mid-call.
    # The two thresholds are deliberately far apart and are measured from the same instant,
    # NOT chained off each other.
    min_value: 1000
    max_value: 14400000
    step: 1000
    mode: box

switch:
  # auto (on, the default) pulls and follows the server. custom (off) FREEZES the table
  # last pulled and stops pulling - the honest one bit of D-38's custom mode, which is
  # the answer to "the server changed and I do not want to follow it right now". It is
  # not local editing; that needs an external component and is #33 (D-40).
  #
  # RESTORE_DEFAULT_ON restores the STORED value and only defaults to on when there is
  # nothing stored - so a freeze SURVIVES a reboot. Measured, because the first version of
  # this comment claimed the opposite.
  #
  # Kept that way on purpose. Freezing is deliberate and nothing about a power cut changes
  # the operator's mind, and it is not a safety question: state still pushes while frozen,
  # so the panel is still current about what is happening. Only the table is held, and a
  # row the frozen table lacks draws as UNKNOWN KEY rather than as anything calm.
  - platform: template
    name: "AutoProfile"
    id: auto_profile
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # The wall clock ON THE GLASS (#69), off by default. A panel exists to answer one question
  # from across a room and the time is not that question, so it is opt-in - and off is also
  # the honest default for a setting whose data source may never arrive.
  #
  # RESTORE_DEFAULT_OFF for auto_profile's reasoning above: the STORED value wins and the
  # default applies only when there is nothing stored, so the choice survives a reboot.
  #
  # WHETHER lives here; WHERE is board knowledge (D-85). The CrowPanel has 800x480 and puts
  # the clock in the middle of its diagnostics band with room to spare. The Elegoo's 128px
  # band is already full at IP + signal, so there the clock TAKES THE IP's slot. One switch,
  # two honest answers, each decided by the file that knows the glass.
  #
  # Both triggers request a repaint, because on the CrowPanel nothing else would: toggling
  # this changes the picture with nothing arriving from the server, so without these the
  # switch would appear to do nothing for up to 30 seconds.
  - platform: template
    name: "ShowClock"
    id: show_clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - lambda: 'id(repaint_pending) = true;'
    on_turn_off:
      then:
        - lambda: 'id(repaint_pending) = true;'

  # NOTE: the onboard-LED switch that used to sit here moved to elegoo-esp32.yaml. It names
  # a PIN, which makes it board knowledge by this file's own rule - and GPIO2 is the
  # CrowPanel's backlight, so leaving it here was not a style problem but a conflict that
  # failed the config outright.

button:
  # "Refresh profile from server" is Rocket's phrase and a good button label (D-42) -
  # note the entity is still the state TABLE everywhere else, deliberately.
  #
  # This pulls even when frozen. Freezing means "stop following automatically"; a press
  # is not automatic, and a frozen panel with no way to ask for the current table would
  # need a reboot to recover.
  - platform: template
    name: "RefreshProfile"
    id: refresh_profile
    on_press:
      then:
        - script.execute: pull_table

script:
  # `single`, not `restart`: the interval, the version nudge, an unknown key and the
  # button can all fire within a second of each other, and re-entering an in-flight
  # request buys nothing. Extra invocations are dropped, which is the correct answer.
  - id: pull_table
    mode: single
    then:
      - lambda: |-
          onair::held().auth_header = "Bearer " + onair::held().passphrase;
          onair::held().inm_header = onair::held().etag;
      - if:
          condition:
            lambda: 'return id(server_host).state.empty();'
          then:
            - logger.log: "config pull skipped - no server host configured"
          else:
            - http_request.get:
                url: !lambda |-
                  return "http://" + id(server_host).state + ":" +
                         std::to_string((int) id(server_port).state) + "/config/states";
                capture_response: true
                # D-38 said 8 kB and 8 kB it is - but the number now has a measurement
                # behind it: the seeded five-row table is 645 bytes on the wire, so a row
                # costs ~129 bytes and this covers ~60 of them. It is not free headroom:
                # the action allocates this WHOLE buffer on every request (measured in
                # 2026.8.0's HttpRequestSendAction::play), so raising it to cover a
                # hypothetical maximum table would churn it every 300s for nothing.
                max_response_buffer_size: 8kB
                request_headers:
                  authorization: !lambda 'return onair::held().auth_header.c_str();'
                  # Makes the steady state a 304 - the difference between a poll that
                  # costs a header and one that costs a table.
                  if-none-match: !lambda 'return onair::held().inm_header.c_str();'
                collect_headers:
                  - etag
                on_error:
                  then:
                    # NOT an error state on the glass. An unreachable server means the
                    # table we hold is the best information available, and it is still
                    # correct - the staleness watchdog is what catches a server that has
                    # stopped talking, and it is already running.
                    - lambda: 'onair::held().failures++;'
                    - logger.log: "config pull failed - keeping the table we have"
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 304) {
                          onair::held().oks++;
                          ESP_LOGD("onair", "config pull: 304, table v%s still current",
                                   onair::held().version.c_str());
                          return;
                        }
                        if (response->status_code != 200) {
                          onair::held().failures++;
                          ESP_LOGW("onair", "config pull: HTTP %d", response->status_code);
                          return;
                        }
                        // A body that exactly fills the buffer is a body we probably
                        // truncated. Say so, because the alternative is a parse failure
                        // reported as if the server sent nonsense.
                        if (body.size() >= 8192) {
                          onair::held().failures++;
                          ESP_LOGW("onair", "config pull: %u bytes filled the buffer - table too large",
                                   (unsigned) body.size());
                          return;
                        }
                        onair::Table next;
                        std::string version;
                        if (!onair::parse_table(body, next, version)) {
                          onair::held().failures++;
                          ESP_LOGW("onair", "config pull: could not parse %u bytes",
                                   (unsigned) body.size());
                          return;
                        }
                        // Through install_table, not by hand: it takes the lock the
                        // device-served page reads under, and `table = next` is a vector
                        // move that would pull the strings out from under a reader on the
                        // HTTP task.
                        onair::install_table(next, version, response->get_response_header("etag"));
                        // A new table can change the label and both colours of the row
                        // already on the glass, so it is a repaint just as much as a
                        // state change is. A 304 is NOT - the table did not move.
                        id(repaint_pending) = true;
                        ESP_LOGI("onair", "config pull: table v%s, %u rows, etag %s",
                                 version.c_str(), (unsigned) onair::held().table.size(),
                                 onair::held().etag.c_str());

  # ---- the state poll (D-91/D-92, #65) ---------------------------------------------
  #
  # THE PANEL PULLS. Until now its only outbound request was the config pull, and state
  # arrived by being PUSHED into `presence_key` - which is why this was the one renderer
  # that could not tell "the server says calm" from "I cannot hear the server". The push
  # survives as a best-effort notification (D-92) and this is what makes missing one
  # harmless.
  #
  # `/status` AND NOT `/public/status`, and the contract already decides this: "a renderer
  # that DOES hold a table must not use these; it takes the state key from the gated
  # endpoints and the look from GET /config/states". This panel holds a table. The public
  # pair is a rendering VIEW for two browser pages that hold none, it is free to change
  # shape to suit them, and building a panel on it would couple the firmware to a payload
  # that is explicitly not a contract. The passphrase is already here for the config pull,
  # so the gated route costs nothing extra.
  #
  # mode: single - a poll that is still in flight when the next is due is skipped, not
  # queued. At 250ms against a 5s timeout a queue would grow without bound.
  - id: poll_status
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(server_host).state.empty();'
          then:
            - logger.log:
                level: DEBUG
                format: "status poll skipped - no server host configured"
          else:
            - http_request.get:
                url: !lambda |-
                  return "http://" + id(server_host).state + ":" +
                         std::to_string((int) id(server_port).state) + "/status";
                capture_response: true
                # The status object is ~300 bytes. 1kB covers it with room for a message
                # and costs a fresh allocation on every poll - which at 250ms is the one
                # place in this firmware where buffer size is worth being tight about.
                max_response_buffer_size: 1kB
                request_headers:
                  authorization: !lambda 'return onair::held().auth_header.c_str();'
                on_error:
                  then:
                    # NOT logged per failure. A server that is down produces four of these
                    # a second, and 915 identical lines is a log that cannot answer when
                    # something went away (#59). The panel's own escalation is the record.
                    - lambda: 'onair::held().poll_failures++;'
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          onair::held().poll_failures++;
                          return;
                        }
                        std::string key;
                        if (!onair::parse_status_key(body, key)) {
                          // An unparseable body is NOT contact. Counting it would let a
                          // server emitting garbage hold this panel confident forever,
                          // which is the fail-OPEN direction.
                          onair::held().poll_failures++;
                          return;
                        }
                        onair::held().poll_oks++;
                        uint32_t t = esphome::millis();
                        id(last_contact_ms) = (t == 0) ? 1 : t;
                        if (id(presence_key).state != key) {
                          // Through the entity, so the existing on_value does its work:
                          // the unknown-key re-pull and the repaint request (#64).
                          auto call = id(presence_key).make_call();
                          call.set_value(key);
                          call.perform();
                        }

interval:
  # ---- the repaint safety net (#64) ------------------------------------------------
  #
  # A missed trigger must not be able to freeze the glass: a panel stuck on a frame that
  # is no longer true is exactly the lie this product exists to prevent, and one wasted
  # repaint every 30s is a cheap premium against it. It also picks up the diagnostics
  # band's IP address and signal strength, which nothing else requests a repaint for.
  #
  # Expressed as a timed SET OF THE FLAG rather than as each display's `update_interval`,
  # so that every repaint in the system arrives through one mechanism and there is a single
  # place to look when asking why the glass redrew. It also belongs here rather than in a
  # board file: "something should redraw every 30s" is true of any panel, while "which
  # display" is board knowledge (D-85).
  - interval: 30s
    then:
      - lambda: 'id(repaint_pending) = true;'

  # ---- driving the poll, and escalating on our own clock (#65) ---------------------
  #
  # 50ms, because the poll interval is CONFIGURABLE down to 250ms and a tick coarser than
  # that would turn a 250ms setting into a 300ms one. The tick itself is two integer
  # comparisons.
  #
  # The second half is what makes the escalation honest: crossing a threshold changes the
  # picture with NOTHING arriving from the server, so nothing else would ever ask for the
  # repaint. It requests one only when the answer actually MOVES, so a panel that has been
  # unrefreshed for ten minutes is not repainting twenty times a second.
  - interval: 50ms
    then:
      - lambda: |-
          uint32_t now = esphome::millis();
          if (now - id(last_poll_ms) >= (uint32_t) id(poll_interval_ms).state) {
            id(last_poll_ms) = now;
            id(poll_status)->execute();
          }
          onair::View v = onair::compute_view(
              id(presence_key).has_state() ? id(presence_key).state : std::string(),
              id(last_contact_ms),
              (uint32_t) id(connection_lost_ms).state,
              (uint32_t) id(no_data_ms).state);
          bool mark = v.unrefreshed || v.shape == onair::Shape::NO_DATA;
          if (mark != id(last_marked_unrefreshed)) {
            id(last_marked_unrefreshed) = mark;
            id(repaint_pending) = true;
          }

  # The device-served page's side of the fence (#33).
  #
  # esp-idf runs web handlers on the httpd task. Nothing there touches an ESPHome
  # component: a page action is STAGED and applied here, on the main loop, and the HTTP
  # task blocks until this has answered. 100ms is invisible to a browser and cheap - the
  # common case is one comparison and a return.
  #
  # publish_context mirrors the two entity values the page needs, because a handler cannot
  # reach an `id()`. Reading a <=100ms-old copy against a 90s staleness threshold is not a
  # difference anyone can observe.
  - interval: 100ms
    then:
      - lambda: |-
          char dbbuf[12] = "";
          if (id(wifi_signal_db).has_state())
            snprintf(dbbuf, sizeof(dbbuf), "%.0fdBm", id(wifi_signal_db).state);
          onair::publish_context(id(presence_key).has_state() ? id(presence_key).state : std::string(),
                                 id(last_contact_ms),
                                 id(ip_address).has_state() ? id(ip_address).state : std::string("connecting..."),
                                 dbbuf,
                                 (uint32_t) id(connection_lost_ms).state,
                                 (uint32_t) id(no_data_ms).state);
          onair::pump();
      - if:
          condition:
            lambda: 'return onair::take_refresh_request();'
          then:
            # Ungated by auto_profile, exactly like the Refresh BUTTON it mirrors: a press
            # is a person asking, not the server asking to be followed.
            - logger.log: "refresh requested from the device page"
            - script.execute: pull_table

  # UNTIL THE FIRST SUCCESSFUL PULL, and then never again.
  #
  # MEASURED, every boot: the pull fired from `on_connect` fails once. on_connect means
  # the association came up, not that there is a usable route - DHCP has not necessarily
  # finished - so the first request goes out too early. Delaying on_connect by a fixed
  # amount would be guessing at someone else's DHCP server.
  #
  # This matters more than one wasted request. Without it, a board that boots while the
  # server is down sits on NO CONFIG for up to 300 seconds after the server comes back,
  # and NO CONFIG is a blank-looking panel. The condition is `!have`, so this stops
  # costing anything the moment it has worked once.
  - interval: 15s
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_profile
              - lambda: 'return !onair::held().have;'
          then:
            - script.execute: pull_table

  # 300s is D-38's number and a taste call it names as one: "if the server changes you
  # change" at a cadence nobody notices, without polling a table that changes monthly.
  # The version nudge is what makes an edit feel immediate; this is the safety net under
  # it, and the only thing that recovers a device that missed a nudge.
  - interval: 300s
    then:
      - if:
          condition:
            switch.is_on: auto_profile
          then:
            - script.execute: pull_table

debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Largest Block"
    fragmentation:
      name: "Heap Fragmentation"
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    id: wifi_signal_db
    update_interval: 10s
  - platform: template
    # Proves the panel actually repainted. A confirmed read says a variable changed;
    # it does not say pixels moved.
    name: "Frames"
    id: frames_sensor
    update_interval: 5s
    accuracy_decimals: 0
    lambda: 'return (float) id(frames);'

text_sensor:
  - platform: template
    name: "Render"
    id: render_sensor
    update_interval: 2s
    lambda: |-
      // Branch 0/5 no longer name a row - a busy row is a busy row and the LABEL is
      // what tells them apart now (D-31). They name the SHAPE that was drawn, which is
      // what this sensor is for: proving what reached the glass, over HTTP.
      //
      // The names come from onair::shape_name, which is also what the device-served
      // status page prints (#33). The numbers ARE onair::Shape's values and have to
      // stay that way; each display branch still assigns its own, so this reports the
      // branch that RAN rather than the branch that was chosen (D-22.1).
      return {std::string(onair::shape_name((onair::Shape) id(render_branch)))};
  - platform: template
    # The current row's LABEL, as drawn. Together with RowColor this is how a config pull
    # is proven from a shell instead of by looking at the panel - which matters because
    # the interesting states are the ones that only last a few seconds.
    #
    # EFFECTIVE, not pulled (#33): these sensors exist to say what reached the glass, and
    # a local override is part of what reached it. `(no table)` and `(unknown key)` are
    # unchanged - an overlay is not a vocabulary and cannot invent a row.
    name: "RowLabel"
    id: row_label_sensor
    update_interval: 5s
    lambda: |-
      if (!onair::held().have) return {"(no table)"};
      onair::Effective eff = onair::effective(id(presence_key).state);
      return eff.known ? eff.row.label : std::string("(unknown key)");
  - platform: template
    # The row's background colour, as pulled. This panel is 1-bit and cannot draw it -
    # what it CAN do with colour is choose between the two calm shapes by luminance, see
    # the display lambda. Publishing the value is how "colour reached the device" stops
    # being an assertion.
    name: "RowColor"
    id: row_color_sensor
    update_interval: 5s
    lambda: |-
      if (!onair::held().have) return {""};
      onair::Effective eff = onair::effective(id(presence_key).state);
      return eff.known ? onair::format_hex_color(eff.row.bgcolor) : std::string("");
  - platform: template
    # version:rows:ok:failed:overrides. One string because it is one question - "is the
    # pull working" - and five sensors would be five things to correlate. The overlay
    # count rides along because "the panel is showing the wrong label" has exactly two
    # causes and this tells them apart without opening a browser (#33).
    name: "ConfigPull"
    id: config_pull_sensor
    update_interval: 5s
    lambda: |-
      char buf[64];
      snprintf(buf, sizeof(buf), "%s:%u:%u:%u:%u",
               onair::held().have ? onair::held().version.c_str() : "none",
               (unsigned) onair::held().table.size(),
               (unsigned) onair::held().oks, (unsigned) onair::held().failures,
               (unsigned) onair::held().overlay.size());
      return {std::string(buf)};
  - platform: template
    # The clock EXACTLY as the glass draws it (#69), and "off" when it is not drawn at all.
    #
    # The same job Render and RowLabel do, for the same reason: these sensors exist so that
    # what reached the glass is READABLE rather than asserted. That argument gets stronger
    # here, because this panel is moving to WiFi-only and will have no serial log to fall
    # back on - a clock is the one thing on the glass whose correctness nobody can check by
    # reading state out of the server.
    #
    # It also makes SNTP's own state legible. `--:--` is a panel that has never been told the
    # time, and from across a room that is indistinguishable from a clock that is merely
    # wrong. Here they are different strings.
    name: "Clock"
    id: clock_sensor
    update_interval: 5s
    lambda: |-
      if (!id(show_clock).state)
        return {"off"};
      auto t = id(wall_clock).now();
      return {onair::format_clock(t.is_valid(), t.hour, t.minute)};
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      id: ip_address
